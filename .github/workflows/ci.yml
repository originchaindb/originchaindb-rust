name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / ${{ matrix.runtime }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: "1.88.0"
          - os: ubuntu-latest
            runtime: "stable"
          - os: windows-latest
            runtime: "stable"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: "${{ matrix.runtime }}"
          components: rustfmt, clippy
      - name: Check out the shared API v1 contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: originchaindb/.github
          ref: a47804a80fc5b31022d241dc814d905f6f78e723
          path: .contract-reference
          persist-credentials: false
      - name: Verify cross-language contract
        run: python scripts/check_contract.py
      - name: Formatting
        run: cargo fmt --check
      - name: Unit tests
        run: cargo test --locked
      - name: Static analysis
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: HTTP contract
        run: python tests/contract/run.py -- cargo run --locked --example contract
      - name: Resilience contract
        run: python tests/contract/resilience.py -- cargo run --locked --example resilience
      - name: Build package
        run: cargo package --locked --allow-dirty
      - name: Build native API reference
        run: cargo doc --locked --no-deps
      - name: Check application integration example
        run: cargo check --locked --example integration
