name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / ${{ matrix.runtime }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: "1.88.0"
          - os: ubuntu-latest
            runtime: "stable"
          - os: windows-latest
            runtime: "stable"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: "${{ matrix.runtime }}"
          components: rustfmt, clippy
      - name: Check out the shared API v1 contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: originchaindb/.github
          ref: 073b0396db55c903ca114f15fab8cf83c4b92e3d
          path: .contract-reference
          persist-credentials: false
      - name: Verify cross-language contract
        run: python scripts/check_contract.py
      - name: Formatting
        run: cargo fmt --check
      - name: Unit tests
        run: cargo test --locked
      - name: Static analysis
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: HTTP contract
        run: python tests/contract/run.py -- cargo run --locked --example contract
      - name: Resilience contract
        run: python tests/contract/resilience.py -- cargo run --locked --example resilience
      - name: Build package
        run: cargo package --locked --allow-dirty
      - name: Build native API reference
        run: cargo doc --locked --no-deps
      - name: Check application integration example
        run: cargo check --locked --example integration

      - name: Bounded iteration contract
        run: |
          python tests/contract/iteration.py -- cargo run --locked --example iteration
      - name: Public API compatibility
        run: |
          python scripts/check_api.py -- cargo run --quiet --locked --example api_surface

  quality:
    name: Performance and package verification
    needs: [verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPOSER_ROOT_VERSION: 1.0.0-rc.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: "1.88.0"
      - name: Prepare SDK and benchmark
        run: |
          cargo build --locked --example benchmark
          python -m pip install psutil==7.2.2
          mkdir -p artifacts
      - name: Build and install package candidate
        run: |
          cargo package --locked --allow-dirty
          cp target/package/*.crate artifacts/
          python scripts/verify_artifact.py
      - name: Measure transport and check performance baseline
        run: |
          python benchmarks/run.py --platform github-ubuntu24-x64 --baseline benchmarks/baseline.json --output benchmark-results.json  -- ./target/debug/examples/benchmark
      - name: Record exact artifact hashes
        run: |
          python scripts/artifact_manifest.py
      - name: Retain benchmark evidence
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: sdk-benchmark
          path: benchmark-results.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain verified package candidates
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: sdk-verified-build
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  provenance:
    name: Sign and verify build provenance
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: sdk-verified-build
          path: artifacts
      - name: Attest verified build artifacts
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: artifacts/*
          push-to-registry: false
      - name: Verify signed provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for artifact in artifacts/*; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"
          done
      - name: Retain provenance bundle
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: sdk-build-provenance
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 14
